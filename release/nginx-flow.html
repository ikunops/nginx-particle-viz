<script>


(function () {


  window.__LIVE = null;


  var PALETTE = ["#8cc8ff", "#8fe3b9", "#f2b872", "#ff9f8c",


                 "#b9a6ff", "#72d4d0", "#d6df7c", "#f0a6c4"];





  function fmtRps(v) {


    if (v >= 1000) return (v / 1000).toFixed(1) + "k rps";


    return Math.round(v) + " rps";


  }





  function build(t) {


    if (!t || !t.nodes) return null;


    var listens = t.nodes.filter(function (n) { return n.kind === "listen"; });


    var ups = t.nodes.filter(function (n) { return n.kind === "upstream"; });


    if (!listens.length && !ups.length) return null;





    var links = t.links || [];





    var clients = listens.map(function (l, i) {


      var nOut = links.filter(function (k) { return k.source === l.id; }).length;


      return {


        id: "in" + (i + 1),


        listenId: l.id,


        role: l.label,


        col: PALETTE[i % PALETTE.length],


        rps: l.rps || 0,


        beat: [l.label + " 入口", nOut + " 个上游", fmtRps(l.rps || 0)]


      };


    });





    /* 一对一归属：每台上游找出真正代理到它的那个 listen 端口。


       之前用 i % AGENTS.length 会循环复用，颜色和归属就失去意义。 */


    var ownerOf = {};


    links.forEach(function (k) {


      if (k.kind === "proxy" && k.source && k.target && !ownerOf[k.target]) {


        ownerOf[k.target] = k.source;


      }


    });





    var upstreams = ups.map(function (u) {


      var ownerId = ownerOf[u.id];


      var owner = null;


      for (var ci = 0; ci < clients.length; ci++) {


        if (clients[ci].listenId === ownerId) { owner = clients[ci]; break; }


      }


      return {


        name: u.label,


        text: fmtRps(u.rps || 0) + " · " + (u.latency || 0).toFixed(1) + "ms",


        rps: u.rps || 0,


        bw: u.bw || 0,


        latency: u.latency || 0,


        state: u.state || "idle",


        ownerListen: owner ? owner.role : "",


        ownerId: owner ? owner.id : ""


      };


    });





    return {


      clients: clients,


      upstreams: upstreams,


      rate: t.rate || { inbound: 0, proxied: 0, ratio: 0 },


      counters: t.counters || {},


      config: t.config || [],


      configInfo: t.configInfo || null,


      capacity: t.capacity || null,


      raw: t,


      ts: Date.now()


    };


  }





  try {


    var xhr = new XMLHttpRequest();


    /* 同步 XHR 不允许设 timeout，设了会抛 InvalidAccessError */


    xhr.open("GET", "/api/topology", false);


    xhr.send(null);


    if (xhr.status === 200) {


      var live = build(JSON.parse(xhr.responseText));


      if (live) window.__LIVE = live;


    }


  } catch (e) { /* fall through to defaults */ }


})();


</script>

for (var w2 = 0; w2 < 32; w2++) { AG.forEach(function (g) { g.load = clamp(g.load + (Math.random() - 0.5) * 0.12, 0.12, 0.8); }); pushHist(); }


function clockTick() { $("clock").textContent = hms(new Date()); }


clockTick(); setInterval(clockTick, 1000);


syncButtons();


var roT = 0;


new ResizeObserver(function () { clearTimeout(roT); roT = setTimeout(layout, 60); }).observe(host);


if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { layout(); });


layout();


// 调试用：document.getElementById('host-forge').__jump('build') / .__next()


host.__jump = function (phase) { var i = PHASES.indexOf(phase); if (i >= 0) { ST.ph = i; ST.t = 0; enterPhase(); } };


host.__next = function () { nextJob(); };


host.__ff = function (sec) { for (var t = 0; t < sec; t += 0.05) { now += 0.05; dustT += 0.05; updateState(0.05); codeStep(0.05); } };


host.__st = function () { return { job: job().id, phase: PHASES[ST.ph], t: ST.t, comets: comets.length, curvesIn: curvesIn.length, curvesOut: curvesOut.length }; };


requestAnimationFrame(frame);





}





/* ================= 主题 07 · WORKS 天工开物（原生 WebGL + 2D，不依赖 three.js） ================= */


/* ================= 系列外壳：挂载主题、切换、记住选择 ================= */


(() => {


  'use strict';


  // 神经星环、机器人工厂、星核蜘蛛要用 three.js，切到它们时才去加载，不拖慢 OPS / SPIDER


  const THREE_CDN = 'https://cdn.jsdelivr.net/npm/three@0.147.0/';


  const THREE_DEPS = ['build/three.min.js', 'examples/js/shaders/CopyShader.js', 'examples/js/shaders/LuminosityHighPassShader.js',


    'examples/js/postprocessing/EffectComposer.js', 'examples/js/postprocessing/RenderPass.js', 'examples/js/postprocessing/ShaderPass.js',


    'examples/js/postprocessing/UnrealBloomPass.js'].map(p => THREE_CDN + p);


  const THEMES = {

    forge: {host: 'host-forge', tpl: 'tpl-forge', mount: mountForge}

  };


  const ORDER = ['forge'], KEY = 'agent-series-theme';


  function loadScripts(list){


    return list.reduce((p, src) => p.then(() => new Promise(res => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = res; document.head.appendChild(s); })), Promise.resolve());


  }


  const mounted = {}, picker = document.getElementById('picker');


  let cur = null, lastFocus = null;


  function show(id){


    if (!THEMES[id]) id = 'forge';


    ORDER.forEach(k => { document.getElementById(THEMES[k].host).hidden = k !== id; });


    const T = THEMES[id], host = document.getElementById(T.host);


    if (!mounted[id]) {


      mounted[id] = true;


      const SR = host.attachShadow({mode: 'open'});


      SR.appendChild(document.getElementById(T.tpl).content.cloneNode(true));


      SR.querySelectorAll('[data-series-pick]').forEach(b => b.addEventListener('click', openPicker));


      const go = () => { try { T.mount(host, SR); } catch (e) { console.error(e); } };


      if (T.deps && !window.THREE) loadScripts(T.deps).then(go); else go();


    }


    cur = id;


    document.documentElement.dataset.series = id;


    document.querySelectorAll('.tcard[data-theme-id]').forEach(b => b.setAttribute('aria-current', String(b.dataset.themeId === id)));


    try { localStorage.setItem(KEY, id); } catch (e) { /* 存不了就算了 */ }


    try { if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id); } catch (e) { /* 预览环境可能不让改地址 */ }


  }


  function openPicker(){ lastFocus = document.activeElement; picker.hidden = false; const c = picker.querySelector('.tcard[aria-current="true"]') || picker.querySelector('.tcard'); c && c.focus(); }


  function closePicker(){ picker.hidden = true; try { lastFocus && lastFocus.focus && lastFocus.focus(); } catch (e) {} }


  picker.addEventListener('click', e => { if (e.target === picker) closePicker(); });


  document.getElementById('pkX').addEventListener('click', closePicker);


  picker.querySelectorAll('.tcard[data-theme-id]').forEach(b => b.addEventListener('click', () => { show(b.dataset.themeId); closePicker(); }));


  document.addEventListener('keydown', e => {


    if (e.key === 'Escape' && !picker.hidden) { closePicker(); return; }


    const tag = (e.target && e.target.tagName) || '';


    if ((e.key === 't' || e.key === 'T') && !e.metaKey && !e.ctrlKey && !e.altKey && !/INPUT|TEXTAREA|SELECT/.test(tag)) {


      show(ORDER[(ORDER.indexOf(cur) + 1) % ORDER.length]);


    }


  });


  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (THEMES[h] && h !== cur) show(h); });


  let start = location.hash.slice(1);


  /* 单主题构建：直接用 forge */
  if (!THEMES[start]) start = 'forge';


  show(THEMES[start] ? start : 'forge');


})();


</script>
