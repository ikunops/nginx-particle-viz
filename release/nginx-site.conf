# nginx photon flow — 站点配置示例
#
# 用法：把这份文件放到 /etc/nginx/conf.d/photon-flow.conf
#       按需修改端口（18100）与 upstream 成员
#       然后 nginx -t && systemctl restart nginx
#
# 注意：必须 restart，不能只 reload —— reload 有时不会重新打开新的日志文件，
#       表现为配置已生效、页面返回 200，但 access_log 一直不写入。

# 真实上游：换成你自己的后端
upstream photon_backend {
    server 127.0.0.1:18081 weight=50 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:18082 weight=50 max_fails=2 fail_timeout=10s;
}

server {
    listen 18100;
    server_name _;
    root /opt/photon-flow/out;
    index nginx-flow.html;

    # 采集器读这个文件；格式见 nginx.conf 里的 log_format photon_metrics
    access_log /var/log/nginx/photon-flow.access.log photon_metrics;

    # 页面本身不允许缓存，否则改了看不到
    location = /nginx-flow.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /nginx-flow.html;
    }

    # 让流量真的经过一个 upstream，这样日志里才有 $upstream_addr
    # 没有这条，所有请求的 upstream_addr 都是 "-"，采集器就无法拆分后端指标
    location /app/ {
        proxy_pass http://photon_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # SSE：必须关闭缓冲，否则事件会攒成一批才到达
    location /api/stream {
        proxy_pass http://127.0.0.1:18200/api/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
        add_header Access-Control-Allow-Origin *;
        add_header X-Accel-Buffering no;
    }

    # 快照 + 配置确认
    location /api/ {
        proxy_pass http://127.0.0.1:18200/api/;
        proxy_set_header Host $host;
        proxy_buffering off;
        add_header Access-Control-Allow-Origin *;
    }
}
